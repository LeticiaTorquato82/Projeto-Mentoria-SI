name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload Jest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report
          path: reports/jest/*.html

      - name: Start API server in background
        run: |
          npm start &
          # wait for server to be ready
          for i in {1..15}; do
            if curl --silent --fail http://localhost:3000/api/health; then
              echo "server up"; break
            fi
            sleep 1
          done

      - name: Run Newman collection
        run: npm run postman:html || npm run postman

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/newman/*.html

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 load test
        run: |
          mkdir -p reports/k6
          k6 run --vus 5 --duration 15s --out json=reports/k6/result.json load/test.js

      - name: Generate k6 HTML report
        run: |
          npx k6-reporter reports/k6/result.json -o reports/k6/report.html || true

      - name: Upload k6 HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: reports/k6/*.html

      - name: Run npm audit (report only)
        run: npm audit --production || true
